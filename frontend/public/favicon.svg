<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1FAE5" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Glass Highlight Inner Border -->
  <rect x="5" y="5" width="54" height="54" rx="15" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Wealth Pulse Waveform & Geometric Hex Shield / Coin Shape -->
  <g transform="translate(14, 15)">
    <!-- Pulse Line Trending Upward -->
    <path 
      d="M2 18 L9 18 L14 8 L20 26 L26 13 L31 18 L34 18" 
      stroke="url(#accentGrad)" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Sparkle / Star Diamond Node -->
    <path 
      d="M26 6 L27.5 10 L31.5 11.5 L27.5 13 L26 17 L24.5 13 L20.5 11.5 L24.5 10 Z" 
      fill="#FFFFFF" 
    />
    
    <!-- Little Accent Dots -->
    <circle cx="14" cy="8" r="2" fill="#FFFFFF" />
    <circle cx="20" cy="26" r="2" fill="#D1FAE5" />
  </g>
</svg>
